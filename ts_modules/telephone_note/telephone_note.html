<div class="col-sm-12">
    <div class="panel panel-default">
        <div class="panel-heading">
            <a href="#collapse_telephone_note" data-toggle="collapse" aria-expanded="true" class="stubegru-module-title">
                <h4 class="mb-4"><i class="fas fa-sticky-note"></i> Telefonnotiz</h4>
                <div class="stubegru-module-subtitle">Schnelle Notiz an die wichtigsten Kontakte</div>
            </a>
        </div>


        <div class="panel-collapse collapse" id="collapse_telephone_note" aria-expanded="false">
            <form id="telephone_note_form">
                <div class="panel-body">

                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Name des Anrufenden</label>
                                <input autocomplete="off" type="text" id="telephone_note_form_name" placeholder="Vorname Nachname" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Matrikelnummer</label>
                                <input autocomplete="off" type="text" id="telephone_note_form_student_id" placeholder="Matrikelnummer" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Telefonnummer</label>
                                <input autocomplete="off" type="text" id="telephone_note_form_phone" placeholder="Telefonnummer" class="form-control">
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>E-Mail</label>
                                <input autocomplete="off" type="text" id="telephone_note_form_mail" placeholder="E-Mail" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Notiz</label>
                        <textarea id="telephone_note_form_note" rows="3" class="form-control"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Empfänger</label>
                                <select class="form-control" id="telephone_note_form_recipients" required>
                                </select>
                            </div>
                        </div>
                        <div class="col-lg-6">
                            <div class="form-group">
                                <label>Anliegen</label>
                                <select class="form-control" id="telephone_note_form_issue" required>
                                    <option value="">Bitte wählen...</option>
                                    <option>Rückruf erbeten</option>
                                    <option>zur Kenntnisnahme</option>
                                    <option>Hiwi kontaktieren</option>
                                    <option>Siehe Notiz</option>
                                </select>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <div class="pull-left" style="color:#4fafd3; cursor:help; margin-top: 5px;" data-toggle="tooltip" title="Um einen Nutzer in dieser Liste als Empfänger hinzuzufügen, muss die entsprechende Berechtigung über die Nutzerverwaltung für jenen Nutzer aktiviert werden."><i class="fa fa-info-circle"></i>&nbsp;Wie kann ich Empfänger hinzufügen? </div>
                    
                    <button type="reset" id="telephone_note_form_reset_button" class="btn btn-default"><i class="fas fa-trash-alt"></i>&nbsp;Reset</button>
                    
                    <button type="submit" id="telephone_note_form_submit_button" class="btn btn-primary"><i class="far fa-envelope"></i>&nbsp;Telefonnotiz senden</button>
                </div>
            </form>
        </div>
    </div>
</div>
